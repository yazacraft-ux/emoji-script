<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>404 - Emoji Script</title>
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#09090d">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" id="brandLink" href="/" aria-label="Emoji Script">
      <span class="brand-mark" aria-hidden="true">🤯</span>
      <span>Emoji<span>Script</span></span>
    </a>
    <div class="header-tools" style="margin-left:auto">
      <a class="lang-switch" id="langLink" href="/en/" hreflang="en" lang="en" aria-label="English version">EN</a>
    </div>
  </header>

  <main class="error-page">
    <div>
      <div class="error-face" aria-hidden="true">😵‍💫</div>
      <div class="error-code" aria-hidden="true">404</div>
      <h1 id="title">Cette page a crashé avant même de compiler.</h1>
      <p id="desc">Le lien que tu cherches n’existe pas, a été déplacé, ou s’est perdu entre deux emojis.</p>
      <a class="btn btn-primary" id="back" href="/">← Retour au compilateur</a>
      <div class="error-mini" id="mini">🗣️🌜💬Page introuvable🤫🌛🙏</div>
    </div>
  </main>

  <script>
    if (location.pathname.indexOf('/en/') === 0) {
      document.documentElement.lang = 'en';
      document.title = '404 - Emoji Script';
      document.getElementById('title').textContent = 'This page crashed before it could compile.';
      document.getElementById('desc').textContent = 'The page you are looking for does not exist, was moved, or got lost between two emojis.';
      var back = document.getElementById('back');
      back.href = '/en/';
      back.textContent = '← Back to the compiler';
      document.getElementById('mini').textContent = '🗣️🌜💬Page not found🤫🌛🙏';
      document.getElementById('brandLink').href = '/en/';
      var lang = document.getElementById('langLink');
      lang.href = '/';
      lang.hreflang = 'fr';
      lang.lang = 'fr';
      lang.textContent = 'FR';
      lang.setAttribute('aria-label', 'Version française');
    }
  </script>
</body>
</html>
