<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — Emoji Script</title>
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0b0b10">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#09090d;color:#f7f7fb;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background-image:radial-gradient(circle at 50% 15%,rgba(255,216,74,.12),transparent 35%)}main{width:min(700px,100%);text-align:center}.face{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 24px;border-radius:22px;background:#ffd84a;font-size:40px;box-shadow:0 20px 60px rgba(255,216,74,.14)}.code{font:900 clamp(80px,22vw,170px)/.9 ui-monospace,monospace;letter-spacing:-.12em;color:#1d1d25;margin-left:-.12em}h1{font-size:clamp(30px,6vw,52px);letter-spacing:-.05em;margin:-36px 0 14px;position:relative}p{color:#8e8e9f;max-width:520px;margin:0 auto 28px}a{display:inline-flex;padding:14px 18px;background:#ffd84a;color:#151109;border-radius:12px;font-weight:900;text-decoration:none}.mini{margin-top:32px;font:600 12px ui-monospace,monospace;color:#666676}
  </style>
</head>
<body>
  <main>
    <div class="face">😵‍💫</div>
    <div class="code">404</div>
    <h1>Cette page a crashé avant même de compiler.</h1>
    <p>Le lien que tu cherches n’existe pas, a été déplacé, ou s’est perdu entre deux emojis.</p>
    <a href="/">← Retour au compilateur</a>
    <div class="mini">🗣️🌜💬Page introuvable🤫🌛🙏</div>
  </main>
</body>
</html>
